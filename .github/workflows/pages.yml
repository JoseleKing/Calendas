# Publica el juego en GitHub Pages en cada push a main (o a mano desde la pestaña Actions).
# Calendas no tiene paso de compilación: se publican tal cual los archivos de la web.
# GitHub Pages solo sirve archivos estáticos, así que la función de Netlify no se
# publica y el juego oculta el porcentaje global de aciertos.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, solo se publica el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Reunir los archivos de la web
        run: |
          mkdir _site
          cp -r index.html css js data icons reiniciar _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v5
